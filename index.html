<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הלו"ז השבועי שלי</title>
    
    <!-- תגיות PWA בשביל שהאייפון יזהה את האפליקציה והלוגו -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <link rel="apple-touch-icon" href="/icon.png">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --today-border: #10b981;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 1.8rem;
            text-align: center;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 0.95rem;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .day-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s;
        }

        .day-card.today {
            border: 2px solid var(--today-border);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .day-title {
            color: var(--accent-color);
        }

        .today-badge {
            background-color: var(--today-border);
            color: white;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: normal;
        }

        .lessons-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .lesson-item {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .lesson-number {
            color: #94a3b8;
            font-weight: 500;
        }

        .lesson-subject {
            font-weight: 600;
        }
    </style>
</head>
<body>

    <h1>הלו"ז השבועי שלי</h1>
    <div class="subtitle">ניהול מערכת השעות בקלות מכל מקום</div>

    <div class="container" id="schedule-container">
        <!-- הלו"ז ייטען אוטומטית לפי היום הנוכחי -->
    </div>

    <script>
        const schedule = [
            { day: "ראשון", lessons: ["מתמטיקה", "אנגלית", "היסטוריה", "מדעים", "חינוך גופני", "תכנות"] },
            { day: "שני", lessons: ["ספרות", "מתמטיקה", "אנגלית", "מדעים", "גיאוגרפיה", "של\"ח"] },
            { day: "שלישי", lessons: ["תנ\"ך", "מתמטיקה", "אנגלית", "לשון", "מחנך", "אמנות"] },
            { day: "רביעי", lessons: ["פיזיקה", "מתמטיקה", "היסטוריה", "מדעים", "חינוך גופני", "מחשבים"] },
            { day: "חמישי", lessons: ["אנגלית", "ספרות", "לשון", "תנ\"ך", "של\"ח", "חברה"] },
            { day: "שישי", lessons: ["מתמטיקה", "אנגלית", "מדעים", "שעת פנויה"] },
            { day: "שבת", lessons: ["יום חופש! 🚀"] }
        ];

        // זיהוי היום הנוכחי בישראל (0 = ראשון, ..., 6 = שבת)
        const todayIndex = new Date().getDay();

        const container = document.getElementById('schedule-container');

        schedule.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = `day-card ${index === todayIndex ? 'today' : ''}`;

            let lessonsHtml = item.lessons.map((lesson, idx) => `
                <li class="lesson-item">
                    <span class="lesson-number">${idx !== item.lessons.length - 1 || item.lessons.length > 1 && item.day !== 'שבת' ? (idx + 1) + '.' : ''}</span>
                    <span class="lesson-subject">${lesson}</span>
                </li>
            `).join('');

            card.innerHTML = `
                <div class="day-header">
                    <span class="day-title">${item.day}</span>
                    ${index === todayIndex ? '<span class="today-badge">היום</span>' : ''}
                </div>
                <ul class="lessons-list">
                    ${lessonsHtml}
                </ul>
            `;

            container.appendChild(card);
        });
    </script>
</body>
</html>
