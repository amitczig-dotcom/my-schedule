<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הלו"ז שלי - אימונים ותזונה</title>
    
    <!-- תגיות PWA בשביל שהאייפון יזהה את האפליקציה והלוגו -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <link rel="apple-touch-icon" href="/icon.png">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --today-border: #10b981;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 1.8rem;
            text-align: center;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 0.95rem;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .day-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s;
        }

        .day-card.today {
            border: 2px solid var(--today-border);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .day-title {
            color: var(--accent-color);
        }

        .today-badge {
            background-color: var(--today-border);
            color: white;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: normal;
        }

        .schedule-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .schedule-item {
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .schedule-time {
            color: #38bdf8;
            font-weight: 600;
            white-space: nowrap;
            min-width: 95px;
        }

        .schedule-desc {
            color: #e2e8f0;
        }
    </style>
</head>
<body>

    <h1>הלו"ז היומי שלי</h1>
    <div class="subtitle">אימונים, תזונה וסדר יום</div>

    <div class="container" id="schedule-container">
        <!-- הלו"ז ייטען אוטומטית לפי היום הנוכחי -->
    </div>

    <script>
        const schedule = [
            {
                day: "ראשון",
                title: "אימון כוח A (חזה, כתפיים, יד קדמית)",
                items: [
                    { time: "14:30", desc: "קימה, שתיית שתי כוסות מים והתעוררות." },
                    { time: "15:00", desc: "ארוחה 1 (צהריים גדולה): חלבון (עוף/בשר/טונה) + פחמימה (אורז/פסטה/תפוח אדמה) + ירקות." },
                    { time: "15:30–18:30", desc: "זמן פנוי / מחשב / סידורים." },
                    { time: "18:30", desc: "ארוחת קדם-אימון קלה: בננה או פרוסת לחם עם דבש." },
                    { time: "19:00–20:30", desc: "אימון כוח A: לחיצת חזה, לחיצת כתפיים, הרחקת כתפיים לצדדים, כפיפות מרפקים ליד קדמית." },
                    { time: "20:45", desc: "ארוחת פוסט-אימון (ערב): חלבון איכותי (ביצים/גבינות/עוף) + פחמימה וסלט." },
                    { time: "21:30–01:30", desc: "זמן פנוי / יציאות / מסכים." },
                    { time: "01:30", desc: "ארוחה אחרונה (לפני שינה): קוטג' / יוגורט או גבינה לבנה." },
                    { time: "03:30", desc: "לילה טוב, הולכים לישון." }
                ]
            },
            {
                day: "שני",
                title: "אימון כוח B (פלג גוף תחתון + בטן)",
                items: [
                    { time: "14:30", desc: "קימה ומים." },
                    { time: "15:00", desc: "ארוחה 1 (צהריים): חלבון + פחמימה מורכבת + ירקות." },
                    { time: "15:30–18:30", desc: "זמן פנוי / מסכים." },
                    { time: "18:30", desc: "ארוחת קדם-אימון: בננה / תמרים." },
                    { time: "19:00–20:30", desc: "אימון כוח B (רגליים + בטן): סקוואט / לאנג'ים, מכשיר דחיקת רגליים, ולסיום אימון בטן ממוקד." },
                    { time: "20:45", desc: "ארוחת ערב (פוסט-אימון)." },
                    { time: "21:30–01:30", desc: "זמן פנוי." },
                    { time: "01:30", desc: "ארוחה אחרונה: מנת חלבון קטנה (כמו קוטג')." },
                    { time: "03:30", desc: "שינה." }
                ]
            },
            {
                day: "שלישי",
                title: "אירובי קליל / מנוחה פעילה",
                items: [
                    { time: "14:30", desc: "קימה ומים." },
                    { time: "15:00", desc: "ארוחה 1 (צהריים)." },
                    { time: "15:30–18:30", desc: "זמן פנוי." },
                    { time: "19:00–20:00", desc: "אירובי קליל / הליכה ארוכה / רכיבת אופניים (או מנוחה מלאה אם עייף)." },
                    { time: "20:30", desc: "ארוחת ערב." },
                    { time: "21:30–01:30", desc: "זמן פנוי." },
                    { time: "01:30", desc: "ארוחה אחרונה." },
                    { time: "03:30", desc: "שינה." }
                ]
            },
            {
                day: "רביעי",
                title: "אימון כוח C (גב, יד אחורית ובטן)",
                items: [
                    { time: "14:30", desc: "קימה ומים." },
                    { time: "15:00", desc: "ארוחה 1 (צהריים)." },
                    { time: "15:30–18:30", desc: "זמן פנוי." },
                    { time: "18:30", desc: "ארוחת קדם-אימון: פרוסת לחם עם ריבה/דבש." },
                    { time: "19:00–20:30", desc: "אימון כוח C: פולי עליון / מתח, חתירה במכונה, פשיטת מרפקים ליד אחורית, 10 דקות בטן." },
                    { time: "20:45", desc: "ארוחת ערב (פוסט-אימון)." },
                    { time: "21:30–01:30", desc: "זמן פנוי." },
                    { time: "01:30", desc: "ארוחה אחרונה." },
                    { time: "03:30", desc: "שינה." }
                ]
            },
            {
                day: "חמישי",
                title: "אימון כוח D (פול בודי / עליון מתקדם)",
                items: [
                    { time: "14:30", desc: "קימה ומים." },
                    { time: "15:00", desc: "ארוחה 1 (צהריים)." },
                    { time: "15:30–18:30", desc: "זמן פנוי / יציאות לסוף שבוע." },
                    { time: "18:30", desc: "ארוחת קדם-אימון." },
                    { time: "19:00–20:30", desc: "אימון כוח D: דגש על תנועות מורכבות (דאמבלים, לחיצות ותרגילי ליבה)." },
                    { time: "20:45", desc: "ארוחת ערב." },
                    { time: "21:30–02:00", desc: "לילה חופשי / יציאה עם חברים." },
                    { time: "02:30", desc: "ארוחה אחרונה." },
                    { time: "04:30", desc: "שינה (אפשר לישון קצת יותר מאוחר)." }
                ]
            },
            {
                day: "שישי",
                title: "מנוחה או אירובי חופשי",
                items: [
                    { time: "15:00", desc: "קימה מאוחרת יותר ושתיית מים." },
                    { time: "15:30", desc: "ארוחת צהריים משפחתית / גדולה." },
                    { time: "16:00–20:00", desc: "זמן פנוי ומנוחה מאימוני השבוע." },
                    { time: "20:30–21:30", desc: "אירובי קליל בבית או מתיחות (אופציונלי)." },
                    { time: "המשך הערב", desc: "זמן פנוי ובילויים." },
                    { time: "02:00", desc: "ארוחה אחרונה." },
                    { time: "04:00", desc: "שינה." }
                ]
            },
            {
                day: "שבת",
                title: "מנוחה מלאה והכנה לשבוע הבא",
                items: [
                    { time: "14:30", desc: "קימה ומים." },
                    { time: "15:00", desc: "ארוחה 1 (צהריים)." },
                    { time: "15:30–19:00", desc: "מנוחה, סידורים לקראת השבוע החדש, מחשב או יציאה קלילה." },
                    { time: "ערב ולילה", desc: "התארגנות על קניות או אוכל לשבוע הקרוב." },
                    { time: "01:30", desc: "ארוחה אחרונה." },
                    { time: "03:30", desc: "שינה לקראת חזרה לגלגל של יום ראשון." }
                ]
            }
        ];

        // זיהוי היום הנוכחי בישראל (0 = ראשון, ..., 6 = שבת)
        const todayIndex = new Date().getDay();

        const container = document.getElementById('schedule-container');

        schedule.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = `day-card ${index === todayIndex ? 'today' : ''}`;

            let itemsHtml = item.items.map(subItem => `
                <li class="schedule-item">
                    <span class="schedule-time">${subItem.time}</span>
                    <span class="schedule-desc">${subItem.desc}</span>
                </li>
            `).join('');

            card.innerHTML = `
                <div class="day-header">
                    <span class="day-title">${item.day} — <span style="font-size: 0.9rem; color: #94a3b8; font-weight: normal;">${item.title}</span></span>
                    ${index === todayIndex ? '<span class="today-badge">היום</span>' : ''}
                </div>
                <ul class="schedule-list">
                    ${itemsHtml}
                </ul>
            `;

            container.appendChild(card);
        });
    </script>
</body>
</html>
