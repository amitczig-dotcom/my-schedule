<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הלו"ז השבועי שלי</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --today-border: #10b981;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 1.8rem;
            text-align: center;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 0.95rem;
            text-align: center;
        }

        /* סרגל בחירת ימים */
        .days-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 10px;
            margin-bottom: 20px;
            width: 100%;
            justify-content: center;
        }

        .day-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid transparent;
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .day-btn:hover {
            background-color: #334155;
        }

        .day-btn.active {
            background: var(--accent-gradient);
            border-color: #60a5fa;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .day-btn.is-today::after {
            content: ' (היום)';
            font-size: 0.75rem;
            color: #34d399;
        }

        /* כרטיסיית תוכן היום */
        .schedule-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border-top: 5px solid var(--accent-color);
        }

        .schedule-title {
            font-size: 1.4rem;
            margin-top: 0;
            margin-bottom: 20px;
            color: #60a5fa;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        .schedule-item {
            display: flex;
            margin-bottom: 15px;
            align-items: flex-start;
            background: rgba(15, 23, 42, 0.4);
            padding: 12px;
            border-radius: 10px;
        }

        .time {
            font-weight: bold;
            color: #38bdf8;
            min-width: 110px;
            font-size: 0.95rem;
        }

        .task {
            flex-grow: 1;
            font-size: 0.95rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>השגרה והלו"ז שלי</h1>
    <div class="subtitle">מתעוררים בצהריים, מתחטבים ובונים קוביות</div>

    <!-- כפתורים לבחירת ימים -->
    <div class="days-nav" id="daysNav"></div>

    <!-- אזור הצגת הלו"ז של היום הנבחר -->
    <div class="schedule-card" id="scheduleCard">
        <h2 class="schedule-title" id="cardTitle">בחר יום</h2>
        <div id="cardContent"></div>
    </div>

    <script>
        // נתוני הלו"ז לכל יממות השבוע (0 = ראשון, עד 6 = שבת)
        const weeklyData = [
            {
                dayName: "יום ראשון",
                title: "יום ראשון | אימון כוח A (חזה, כתפיים, יד קדמית)",
                items: [
                    { time: "14:30", text: "קימה, שתיית שתי כוסות מים והתעוררות." },
                    { time: "15:00", text: "ארוחה 1 (צהריים גדולה): חלבון (עוף/בשר/טונה) + פחמימה (אורז/פסטה/תפוח אדמה) + ירקות." },
                    { time: "15:30-18:30", text: "זמן פנוי / מחשב / סידורים." },
                    { time: "18:30", text: "ארוחת קדם-אימון קלה: בננה או פרוסת לחם עם דבש." },
                    { time: "19:00-20:30", text: "💪 אימון כוח A (חזה, כתפיים, יד קדמית)." },
                    { time: "20:45", text: "ארוחת פוסט-אימון (ערב): חלבון איכותי + פחמימה וסלט." },
                    { time: "21:30-01:30", text: "זמן פנוי / יציאות / מסכים." },
                    { time: "01:30", text: "ארוחה אחרונה (לפני שינה): קוטג' / יוגורט או גבינה לבנה." },
                    { time: "03:30", text: "לילה טוב, הולכים לישון." }
                ]
            },
            {
                dayName: "יום שני",
                title: "יום שני | אימון כוח B (רגליים + בטן)",
                items: [
                    { time: "14:30", text: "קימה ומים." },
                    { time: "15:00", text: "ארוחה 1 (צהריים): חלבון + פחמימה מורכבת + ירקות." },
                    { time: "15:30-18:30", text: "זמן פנוי / מסכים." },
                    { time: "18:30", text: "ארוחת קדם-אימון: בננה / תמרים." },
                    { time: "19:00-20:30", text: "🦵 אימון כוח B (רגליים + בטן ממוקד: כפיפות בטן, פלאנק, הרמות רגליים)." },
                    { time: "20:45", text: "ארוחת ערב (פוסט-אימון)." },
                    { time: "21:30-01:30", text: "זמן פנוי." },
                    { time: "01:30", text: "ארוחה אחרונה: מנת חלבון קטנה (קוטג')." },
                    { time: "03:30", text: "שינה." }
                ]
            },
            {
                dayName: "יום שלישי",
                title: "יום שלישי | אירובי קליל / מנוחה פעילה",
                items: [
                    { time: "14:30", text: "קימה ומים." },
                    { time: "15:00", text: "ארוחה 1 (צהריים)." },
                    { time: "15:30-18:30", text: "זמן פנוי." },
                    { time: "19:00-20:00", text: "🚴 אירובי קליל / הליכה ארוכה / רכיבת אופניים (או מנוחה מלאה אם עייף)." },
                    { time: "20:30", text: "ארוחת ערב." },
                    { time: "21:30-01:30", text: "זמן פנוי." },
                    { time: "01:30", text: "ארוחה אחרונה." },
                    { time: "03:30", text: "שינה." }
                ]
            },
            {
                dayName: "יום רביעי",
                title: "יום רביעי | אימון כוח C (גב, יד אחורית ובטן)",
                items: [
                    { time: "14:30", text: "קימה ומים." },
                    { time: "15:00", text: "ארוחה 1 (צהריים)." },
                    { time: "15:30-18:30", text: "זמן פנוי." },
                    { time: "18:30", text: "ארוחת קדם-אימון: פרוסת לחם עם ריבה/דבש." },
                    { time: "19:00-20:30", text: "🦍 אימון כוח C (גב, יד אחורית ו-10 דקות בטן)." },
                    { time: "20:45", text: "ארוחת ערב (פוסט-אימון)." },
                    { time: "21:30-01:30", text: "זמן פנוי." },
                    { time: "01:30", text: "ארוחה אחרונה." },
                    { time: "03:30", text: "שינה." }
                ]
            },
            {
                dayName: "יום חמישי",
                title: "יום חמישי | אימון כוח D (פלג גוף עליון מתקדם)",
                items: [
                    { time: "14:30", text: "קימה ומים." },
                    { time: "15:00", text: "ארוחה 1 (צהריים)." },
                    { time: "15:30-18:30", text: "זמן פנוי / יציאות לסוף שבוע." },
                    { time: "18:30", text: "ארוחת קדם-אימון." },
                    { time: "19:00-20:30", text: "🔥 אימון כוח D (תרגילים מורכבים וליבה)." },
                    { time: "20:45", text: "ארוחת ערב." },
                    { time: "21:30-02:00", text: "לילה חופשי / יציאה עם חברים." },
                    { time: "02:30", text: "ארוחה אחרונה." },
                    { time: "04:30", text: "שינה (אפשר לישון מאוחר יותר בחמישי)." }
                ]
            },
            {
                dayName: "יום שישי",
                title: "יום שישי | מנוחה / אירובי חופשי",
                items: [
                    { time: "15:00", text: "קימה מאוחרת ושתיית מים." },
                    { time: "15:30", text: "ארוחת צהריים משפחתית / גדולה." },
                    { time: "16:00-20:00", text: "זמן פנוי ומנוחה מאימוני הכוח." },
                    { time: "20:30-21:30", text: "🚶 אירובי קליל בבית או מתיחות (או מנוחה מלאה)." },
                    { time: "המשך הערב", text: "זמן פנוי ובילויים." },
                    { time: "02:00", text: "ארוחה אחרונה." },
                    { time: "04:00", text: "שינה." }
                ]
            },
            {
                dayName: "יום שבת",
                title: "יום שבת | מנוחה מלאה והתארגנות",
                items: [
                    { time: "14:30", text: "קימה ומים." },
                    { time: "15:00", text: "ארוחה 1 (צהריים)." },
                    { time: "15:30-19:00", text: "מנוחה, סידורים, מחשב או יציאה קלילה." },
                    { time: "ערב ולילה", text: "זמן פנוי והתארגנות על אוכל לקראת השבוע החדש." },
                    { time: "01:30", text: "ארוחה אחרונה." },
                    { time: "03:30", text: "שינה לקראת חזרה לגלגל." }
                ]
            }
        ];

        // מציאת היום הנוכחי במערכת (בג'אווה סקריפט: 0 זה ראשון, 1 זה שני, וכו')
        const todayIndex = new Date().getDay();

        // יצירת הכפתורים בסרגל העליון
        const daysNav = document.getElementById('daysNav');
        
        weeklyData.forEach((dayObj, index) => {
            const btn = document.createElement('button');
            btn.className = 'day-btn';
            btn.innerText = dayObj.dayName;
            
            if (index === todayIndex) {
                btn.classList.add('is-today');
            }
            
            btn.onclick = () => showDay(index);
            daysNav.appendChild(btn);
        });

        // פונקציה להצגת הלו"ז לפי היום שנבחר
        function showDay(index) {
            // עדכון כפתורים פעילים
            const buttons = document.querySelectorAll('.day-btn');
            buttons.forEach((b, i) => {
                if (i === index) {
                    b.classList.add('active');
                } else {
                    b.classList.remove('active');
                }
            });

            // הצגת תוכן היום
            const dayData = weeklyData[index];
            document.getElementById('cardTitle').innerText = dayData.title;
            
            const cardContent = document.getElementById('cardContent');
            cardContent.innerHTML = '';

            dayData.items.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'schedule-item';
                itemDiv.innerHTML = `
                    <div class="time">${item.time}</div>
                    <div class="task">${item.text}</div>
                `;
                cardContent.appendChild(itemDiv);
            });
        }

        // טעינה אוטומטית של היום הנוכחי ברגע שפותחים את האפליקציה
        showDay(todayIndex);
    </script>
</body>
</html>
